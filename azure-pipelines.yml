
trigger:
- main

variables:
- group: gobi-brands-secrets

pool:
  vmImage: ubuntu-latest

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: |
    npm ci
    npm run build
  displayName: 'Install dependencies and build Next.js'
  env:
    MONGODB_URI: $(MONGODB_URI)
