
trigger:
  - main

variables:
  - group: gobi-brands-secrets

pool:
  vmImage: ubuntu-24.04

stages:
  # STAGE 1: BUILD
  - stage: Build
    displayName: Build Application
    jobs:
      - job: BuildJob
        displayName: Build Next.js
        steps:
          - task: UseNode@1
            displayName: Install Node.js
            inputs:
              version: '20.x'

          - script: npm ci
            displayName: Install dependencies

          - script: npm run build
            displayName: Build Next.js
            env:
              MONGODB_URI: $(MONGODB_URI)

  # STAGE 2: TEST
  - stage: Test
    displayName: Test Application
    dependsOn: Build
    jobs:
      - job: TestJob
        displayName: Run checks
        steps:
          - task: UseNode@1
            displayName: Install Node.js
            inputs:
              version: '20.x'

          - script: npm ci
            displayName: Install dependencies

          - script: npm run lint
            displayName: Run ESLint
          
          - script: npm test -- --ci
            displayName: Run Jest tests

