
trigger:
  - main

variables:
  - group: gobi-brands-secrets

pool:
  vmImage: ubuntu-24.04

stages:
  # STAGE 1: BUILD
  - stage: Build
    displayName: Build Application
    jobs:
      - job: BuildJob
        displayName: Build Next.js
        steps:
          - task: UseNode@1
            displayName: Install Node.js
            inputs:
              version: "24.x"

          - script: npm ci
            displayName: Install dependencies

          - script: npm run build
            displayName: Build Next.js
            env:
              MONGODB_URI: $(MONGODB_URI)

  # STAGE 2: TEST
  - stage: Test
    displayName: Test Application
    dependsOn: Build
    jobs:
      - job: TestJob
        displayName: Run checks
        steps:
          - task: UseNode@1
            displayName: Install Node.js
            inputs:
              version: "24.x"

          - script: npm ci
            displayName: Install dependencies

          - script: npm run lint
            displayName: Run ESLint

          - script: npm test -- --ci
            displayName: Run Jest tests

          - script: |
              node --version
              npm --version
              npm ls jest ts-jest mongodb bson
            displayName: Check test environment

          - script: |
              if [[ "$MONGODB_TEST_URI" == mongodb+srv://* || "$MONGODB_TEST_URI" == mongodb://* ]]; then
                echo "MongoDB test URI has a valid prefix."
              else
                echo "MongoDB test URI is missing or has an invalid prefix."
                exit 1
              fi
            displayName: Validate MongoDB test URI
            env:
              MONGODB_TEST_URI: $(MONGODB_TEST_URI)

          - script: npm run test:integration
            displayName: Run API Integration Tests
            env:
              MONGODB_TEST_URI: $(MONGODB_TEST_URI)

  # STAGE 3: DOCKER
  - stage: Docker
    displayName: Build and Push Docker Image
    dependsOn: Test
    jobs:
      - job: DockerJob
        displayName: Publish GOBI Image
        steps:
          - task: Docker@2
            displayName: Build and Push to Docker Hub
            inputs:
              command: buildAndPush
              containerRegistry: dockerhub-gobi
              repository: $(DOCKERHUB_USERNAME)/gobi-brands
              Dockerfile: '**/Dockerfile'
              buildContext: .
              tags: |
                latest
                $(Build.BuildId)
